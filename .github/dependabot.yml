# Dependabot configuration.
#
# forge is a Go workspace (go.work) with five member modules. Without this
# file, Dependabot filed one PR per otel sub-module per directory — e.g. a
# single 1.44 -> 1.45 otel bump produced ~10 separate PRs. The `opentelemetry`
# group below collapses all go.opentelemetry.io/* bumps in a module into one PR.
#
# A `directories:` list is used (rather than a single go.work root entry) so
# discovery matches Dependabot's existing per-module behavior exactly and only
# the grouping changes.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /forge-core
      - /forge-cli
      - /forge-plugins
      - /forge-skills
      - /forge-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
