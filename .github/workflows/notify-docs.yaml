name: Notify docs update

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

# Least privilege: this workflow only fires a repository_dispatch to another
# repo via a dedicated PAT (USEFORGE_DISPATCH_TOKEN); it needs no write scope
# on GITHUB_TOKEN for this repo.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger useforge.ai rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.USEFORGE_DISPATCH_TOKEN }}
          repository: initializ/useforge.ai
          event-type: docs-updated
          client-payload: '{"ref": "${{ github.sha }}"}'
